name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Type-check (no emit)
        run: |
          npx tsc -p packages/core/tsconfig.json
          npx tsc -p packages/invariant/tsconfig.json
          npx tsc -p packages/plugin/tsconfig.json

      - name: Run tests
        run: npx vitest run
